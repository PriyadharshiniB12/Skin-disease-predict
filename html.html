<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Based Skin Disease Detection</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .container {
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        input {
            margin-bottom: 20px;
        }
        img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI-Based Skin Disease Detection</h1>
        <input type="file" accept="image/*" id="imageInput">
        <br>
        <img id="uploadedImage" style="display:none;" alt="Uploaded Image">
        <br>
        <button onclick="handleDetect()">Detect Skin Disease</button>
        <p class="result" id="resultText"></p>
    </div>

    <script>
        const imageInput = document.getElementById("imageInput");
        const uploadedImage = document.getElementById("uploadedImage");
        const resultText = document.getElementById("resultText");

        imageInput.addEventListener("change", (event) => {
            const file = event.target.files[0];
            if (file) {
                uploadedImage.src = URL.createObjectURL(file);
                uploadedImage.style.display = "block";
            }
        });

        function handleDetect() {
            if (!uploadedImage.src) {
                alert("Please upload an image first.");
                return;
            }
            
            resultText.textContent = "Analyzing...";
            setTimeout(() => {
                resultText.textContent = "Melanoma Detected (High Risk). Please consult a dermatologist.";
            }, 2000);
        }
    </script>
</body>
</html>
